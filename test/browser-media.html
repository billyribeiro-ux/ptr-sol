<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Local media verification</title>
<style>body{font:16px system-ui;margin:2rem;max-width:850px}button{padding:.7rem 1.4rem}pre{white-space:pre-wrap;background:#eee;padding:1rem}video{width:320px;background:#111} .pass{color:green}.fail{color:#a00}</style></head>
<body><h1>Local media verification</h1><p>Creates a disposable local account and tests synthetic video, audio, and recording. No camera or microphone is used.</p><button id="run">Run verification</button><p id="result">Not started</p><video id="remote" autoplay muted playsinline></video><audio id="audio" autoplay></audio><pre id="log"></pre>
<script src="/public/dist/vendor.min.js"></script><script src="/public/vendor/adapter.js"></script><script src="/public/ptr-config.js"></script>
<script>window.getUserMedia=window.getUserMedia||navigator.getUserMedia||function(c,ok,fail){navigator.mediaDevices.getUserMedia(c).then(ok,fail)};window.attachMediaStream=window.attachMediaStream||function(el,stream){el.srcObject=stream;return el};</script>
<script src="/public/vendor/janus3.js"></script><script>
'use strict';
const result=document.querySelector('#result'),log=document.querySelector('#log'),video=document.querySelector('#remote');
function report(s){log.textContent+=s+'\n';console.log(s)}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,label,ms=25000){const end=Date.now()+ms;while(Date.now()<end){const v=fn();if(v)return v;await pause(100)}throw Error('Timed out: '+label)}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok||data.success===false)throw Error(data.message||'Request failed: '+url);return data}
function attach(janus,plugin,callbacks){return new Promise((resolve,reject)=>janus.attach({plugin,success:resolve,error:reject,...callbacks}))}
function timeout(promise,label,ms=20000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('Timed out: '+label)),ms))])}
function offer(handle,stream,media){return new Promise((resolve,reject)=>handle.createOffer({stream,media,success:resolve,error:reject}))}
function answer(handle,jsep){return new Promise((resolve,reject)=>handle.createAnswer({jsep,media:{audioSend:false,videoSend:false},success:resolve,error:reject}))}
document.querySelector('#run').onclick=async function(){
 this.disabled=true;result.textContent='Running';log.textContent='';let socket,janus,ctx,osc,canvasTimer;
 try {
  ctx=new AudioContext();await ctx.resume();
  const unique=crypto.randomUUID().slice(0,12),email='qa-'+unique+'@example.test',pw='Test-'+crypto.randomUUID();
  const signup=await post('/users/v1/signup',{name:'Media QA',email,pw});await post('/users/v1/login',{email,pw});
  const room=signup.roomUUID;const relayQA=new URLSearchParams(location.search).get('relay')==='1';if(relayQA)await post('/users/v1/sessions',{cmd:'saveSessField',sessionID:room,token:signup.token,fieldName:'hasYTStreaming',fieldVal:true});const login=await post('/users/v1/users.json',{cmd:'loginChat',roomID:room,token:signup.token});report('Created isolated room '+room);
  const events=[];socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/talk/websocket');socket.onmessage=e=>{const m=JSON.parse(e.data);events.push(m);if(m.type==='error')report('Server error: '+m.data.message)};await new Promise((resolve,reject)=>{socket.onopen=resolve;socket.onerror=reject});
  const send=(type,data)=>socket.send(JSON.stringify({type,data}));send('join',{roomID:room,jwtToken:login.token});const logged=await until(()=>events.find(e=>e.type==='loggedIn')?.data,'socket login');const state=await until(()=>events.find(e=>e.type==='getRoomState')?.data,'room state');if(!state.audioRoomReady||!state.videoRoomID)throw Error('Media gateway not ready');report('Joined authorized room; audio '+state.audioRoomID+', video '+state.videoRoomID);
  const canvas=document.createElement('canvas');canvas.width=320;canvas.height=180;const c=canvas.getContext('2d');let ticks=0;canvasTimer=setInterval(()=>{c.fillStyle=ticks++%2?'#084':'#18b';c.fillRect(0,0,320,180);c.fillStyle='white';c.font='30px sans-serif';c.fillText('Synthetic '+ticks,20,90)},100);
  const visual=canvas.captureStream(10);osc=ctx.createOscillator();const destination=ctx.createMediaStreamDestination();osc.connect(destination);osc.start();
  await timeout(new Promise(resolve=>Janus.init({debug:false,callback:resolve})),'Janus initialization');report('Janus initialized');janus=await timeout(new Promise((resolve,reject)=>{let j;j=new Janus({server:location.origin+'/janus',success:()=>resolve(j),error:reject})}),'Janus session');report('Janus session created');
  let screen,screenJoined=false,screenId,videoReady=false,videoTrack=false;
  screen=await attach(janus,'janus.plugin.videoroom',{onmessage:async(msg,jsep)=>{try{if(msg.videoroom==='joined'&&!screenJoined){screenJoined=true;screenId=msg.id;const sdp=await offer(screen,visual,{audio:false,videoSend:true,videoRecv:false});screen.send({message:{request:'configure',audio:false,video:true},jsep:sdp})}if(jsep)screen.handleRemoteJsep({jsep});if(msg.error)report('Video publisher: '+msg.error)}catch(e){report('Video publisher: '+e.message)}},webrtcState:on=>{if(on)videoReady=true}});
  screen.send({message:{request:'join',room:state.videoRoomID,ptype:'publisher',display:'screen-'+logged.uid+'-p'}});await until(()=>videoReady&&screenId,'video publisher WebRTC');send('addScreenStream',{roomID:state.videoRoomID,pub_id:screenId,mode:'screen'});await until(()=>events.find(e=>e.type==='addScreenStream'&&e.data.uid===logged.uid),'validated screen announcement');report('Synthetic screen published and validated');
  let viewer;viewer=await attach(janus,'janus.plugin.videoroom',{onmessage:async(msg,jsep)=>{try{if(jsep){const sdp=await answer(viewer,jsep);viewer.send({message:{request:'start',room:state.videoRoomID},jsep:sdp})}if(msg.error)report('Video subscriber: '+msg.error)}catch(e){report('Video subscriber: '+e.message)}},onremotestream:stream=>{video.srcObject=stream;videoTrack=stream.getVideoTracks().length>0;video.play().catch(()=>{})}});viewer.send({message:{request:'join',room:state.videoRoomID,ptype:'subscriber',feed:screenId}});
  await until(()=>videoTrack&&video.videoWidth>0&&video.currentTime>0,'remote video frames');report('Remote video frames received');
  let audioPub,audioReady=false,audioJoined=false;audioPub=await attach(janus,'janus.plugin.audiobridge',{onmessage:async(msg,jsep)=>{try{if(msg.audiobridge==='joined'&&!audioJoined){audioJoined=true;const sdp=await offer(audioPub,destination.stream,{audioSend:true,audioRecv:true,video:false});audioPub.send({message:{request:'configure',muted:false},jsep:sdp})}if(jsep)audioPub.handleRemoteJsep({jsep});if(msg.error)report('Audio publisher: '+msg.error)}catch(e){report('Audio publisher: '+e.message)}},webrtcState:on=>{if(on)audioReady=true}});audioPub.send({message:{request:'join',room:state.audioRoomID,display:'qa-audio',muted:false}});await until(()=>audioReady,'audio publisher');
  let listener,audioTrack=false,audioListenJoined=false;listener=await attach(janus,'janus.plugin.audiobridge',{onmessage:async(msg,jsep)=>{try{if(msg.audiobridge==='joined'&&!audioListenJoined){audioListenJoined=true;const sdp=await offer(listener,undefined,{audioSend:false,audioRecv:true,video:false});listener.send({message:{request:'configure',muted:true},jsep:sdp})}if(jsep)listener.handleRemoteJsep({jsep});if(msg.error)report('Audio subscriber: '+msg.error)}catch(e){report('Audio subscriber: '+e.message)}},onremotestream:stream=>{document.querySelector('#audio').srcObject=stream;audioTrack=stream.getAudioTracks().length>0}});listener.send({message:{request:'join',room:state.audioRoomID,display:'qa-listener',muted:true}});await until(()=>audioTrack,'remote audio track');report('Remote audio track received');if(relayQA){send('startYTStream','test');await until(()=>events.some(e=>e.type==='getRoomState'&&e.data.isYTStreaming),'RTMP output frames',40000);report('Actual Janus to FFmpeg RTMP output verified');}
  send('startRec',null);await until(()=>events.some(e=>e.type==='getRoomState'&&e.data.isRecording),'recording start');report('Native recording started');await pause(5000);send('stopRec',null);await until(()=>events.some(e=>e.type==='recStopped'),'recording stop');report('Recording stopped; processing');
  let recording;for(let i=0;i<120;i++){const rows=await post('/users/v1/recordings',{roomID:room,token:signup.token});recording=rows[0];if(recording?.status==='failed')throw Error('Recording processing failed');if(recording?.status==='ready')break;await pause(1000)}if(recording?.status!=='ready'||!recording.vidPath)throw Error('Recording did not become ready');if(recording.contentType!=='video/mp4')throw Error('Recording has no video: '+recording.contentType);const file=await fetch(recording.vidPath);if(!file.ok||!(await file.blob()).size)throw Error('Recording download failed');report('Recording ready and downloadable: '+recording.vidPath);if(relayQA){const marker=events.length;send('stopYTStream',null);await until(()=>events.slice(marker).some(e=>e.type==='getRoomState'&&!e.data.isYTStreaming&&e.data.isYTStreaming!==undefined),'RTMP stop');report('RTMP relay stopped');}result.className='pass';result.textContent='PASS — video frames, audio track, and recording verified';
 }catch(error){report('FAILED: '+(error.message||String(error)));result.className='fail';result.textContent='FAIL — '+(error.message||String(error))}finally{clearInterval(canvasTimer);try{osc?.stop();await ctx?.close();janus?.destroy();socket?.close()}catch(_){}this.disabled=false}
};
</script></body></html>
