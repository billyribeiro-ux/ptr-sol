# OBS ingest only. Random publish paths are authorized by the private sidecar.
logLevel: error
rtmp: yes
rtmpAddress: :1935
rtsp: no
hls: no
webrtc: no
srt: no
api: yes
apiAddress: :9997
metrics: no
pprof: no
playback: no
authMethod: http
authHTTPAddress: http://media-processor:8090/obs/auth
authHTTPExclude: []
paths:
  all_others:
