<div ui-view="" autoscroll="false" class="ng-fadeOutZoom ng-fluid ng-scope">
  <div class="container container-sm animated fadeInDown ng-scope">
    <div ng-controller="LoginCtrl" class="center-block mt-xl">
      <a href="/"
        ><img src="/public/images/protradingroom_icon_dark.png" alt="Image" class="pull-left" />
        <span class="title" style="color: black">ProTradingRoom.com</span></a
      >
      <br /><br /><br />

      <div class="panel">
        <div class="panel-body">
          <p class="pv text-bold">Create PTR Demo account</p>
          <form role="form" class="mb-lg ng-pristine ng-valid" ng-submit="submitDemoSignup()">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group has-feedback">
                  <input ng-model="demoSignup.name" type="text" placeholder="Your full name" autocomplete="off" class="form-control" name="demoSignup.name" aria-label="Your full name" />
                  <span class="form-control-feedback text-muted"></span>
                </div>

                <div class="form-group has-feedback">
                  <input ng-model="demoSignup.email" type="email" placeholder="Your email" autocomplete="off" class="form-control" name="demoSignup.email" aria-label="Your email" />
                  <span class="fa fa-envelope form-control-feedback text-muted"></span>
                </div>
                <div class="form-group has-feedback">
                  <input
                    id="signupInputPassword1"
                    ng-model="demoSignup.pass"
                    type="password"
                    placeholder="Your password"
                    autocomplete="off"
                    class="form-control" aria-label="Your password"
                  />
                  <span class="fa fa-lock form-control-feedback text-muted"></span>
                </div>
                <div class="form-group has-feedback">
                  <input
                    id="signupInputRePassword1"
                    ng-model="demoSignup.pass2"
                    type="password"
                    placeholder="Type your password again"
                    autocomplete="off"
                    class="form-control" aria-label="Type your password again"
                  />
                  <span class="fa fa-lock form-control-feedback text-muted"></span>
                </div>
                <div class="form-group has-feedback">
                  <input ng-model="demoSignup.roomName" type="text" placeholder="Room name" autocomplete="off" class="form-control" name="demoSignup.roomName" aria-label="Room name" />
                  <span class="form-control-feedback text-muted"></span>
                </div>
                <div class="form-group has-feedback">
                  <input ng-model="demoSignup.clusterID" type="text" placeholder="ClusterID" autocomplete="off" class="form-control" name="demoSignup.clusterID" aria-label="Cluster ID" />
                  <span class="form-control-feedback text-muted"></span>
                </div>

                <div class="form-group has-feedback">
                  <div class="g-recaptcha"></div>
                </div>

                <div class="clearfix">
                  <div class="checkbox c-checkbox pull-left mt0">
                    <label>
                      <input type="checkbox" value="" ng-model="demoSignup.agreeTOSChk" name="demoSignup.agreeTOSChk" />
                      <span class="fa fa-check"></span>I agree with the <a href="">terms</a>
                    </label>
                  </div>
                </div>
                <div class="form-group has-feedback">
                  <button type="submit" class="btn btn-block btn-primary">Create demo account</button>

                  <!-- <p class="pt-lg text-center mt-sm">
                    Already register?
                    <a ui-sref="page.welcome" href="#/page/welcome" style="text-decoration: underline"> Login here </a>
                  </p> -->
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- <div class="text-center mt">
        <a ui-sref="page.forgot-password" class="text-muted" href="#/page/forgot-password">Forgot your password?</a>
      </div> -->
      <!-- END panel-->
      <!-- ngInclude: 'app/views/page.footer.html' -->
      <div ng-include="'app/views/page.footer.html'" class="p-lg text-center ng-scope">
        <hr class="ng-scope" />
        <span class="mr-sm ng-scope">©</span>
        <span ng-bind="app.year" class="mr-sm ng-binding ng-scope">2015</span>
        <span ng-bind="app.name" class="ng-binding ng-scope">Naut</span>
        <br class="ng-scope" /><span class="ng-binding ng-scope">Bootstrap + AngularJS</span>
      </div>
    </div>
  </div>
</div>
