<style>
    .flot-pie-label {
        color: aliceblue;
    }
</style>
<div ui-view ng-controller="FlotChartController" autoscroll="false" class="ng-fadeOutZoom ng-fluid ng-scope" style="background-color: 0A0A0A;">
    <div class="container container-sm animated fadeInDown ng-scope">
    <div class="row">
      <div class="col-lg-6">
         <div class="panel panel-default">
            <div class="panel-heading">
               <div class="panel-title">Monthly Averages</div>
            </div>
            <div class="panel-body">
               <div class="indicator show">
                  <span class="spinner"></span>
               </div>
               <flot src="'server/chart/barstacked.json'" options="chartBarStackedFlotChart" class="ng-isolate-scope"><div style="width: 100%; height: 220px;"></div></flot>
            </div>
         </div>
      </div>
      <div class="col-md-6">
         <div class="panel panel-default">
            <div class="panel-heading">
               <div class="panel-title">Monthly User Distribution</div>
            </div>
            <div class="panel-body">
               <flot src="'server/chart/pie.json'" options="chartPieFlotChart" class="ng-isolate-scope"><div style="width: 100%; height: 220px;"></div></flot>
            </div>
         </div>
      </div>
   </div>
   <!-- START row-->
   <div class="row">
      <div class="col-lg-6">
         <div class="panel panel-default">
            <div class="panel-heading">
               <div class="panel-title">Daily</div>
            </div>
            <div class="panel-body">
               <flot src="'server/chart/area.json'" options="chartAreaFlotChart" series="{'lines': areaSeries}" class="ng-isolate-scope"><div style="width: 100%; height: 220px;"></div></flot>
               <div class="text-center mt-lg">
                  <div class="btn-switch mb btn-switch-warning">
                     <input type="checkbox" id="input-btn-switch-10" ng-model="areaSeries[0]" class="ng-pristine ng-untouched ng-valid">
                     <label for="input-btn-switch-10" class="btn btn-fw btn-warning">
                        <em class="fa fa-check"></em>
                        <strong>John Carter</strong>
                     </label>
                  </div>
                  <div class="btn-switch mb btn-switch-orange">
                     <input type="checkbox" id="input-btn-switch-11" ng-model="areaSeries[1]" class="ng-pristine ng-untouched ng-valid">
                     <label for="input-btn-switch-11" class="btn btn-fw btn-orange">
                        <em class="fa fa-check"></em>
                        <strong>Henry</strong>
                     </label>
                  </div>
                  <div class="btn-switch mb btn-switch-danger">
                     <input type="checkbox" id="input-btn-switch-12" ng-model="areaSeries[2]" class="ng-pristine ng-untouched ng-valid">
                     <label for="input-btn-switch-12" class="btn btn-fw btn-danger">
                        <em class="fa fa-check"></em>
                        <strong>Bruce</strong>
                     </label>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <div class="col-lg-6">
         <div class="panel panel-default">
            <div class="panel-heading">
               <div class="panel-title">Daily Averages</div>
            </div>
            <div class="panel-body">
               <flot src="'server/chart/spline.json'" options="chartSplineFlotChart" series="{splines: areaSplineSeries}" class="ng-isolate-scope"><div style="width: 100%; height: 220px;"></div></flot>
               <div class="text-center mt-lg">
                  <div class="btn-switch mb btn-switch-info">
                     <input type="checkbox" id="input-btn-switch-20" ng-model="areaSplineSeries[0]" class="ng-pristine ng-untouched ng-valid">
                     <label for="input-btn-switch-20" class="btn btn-oval btn-fw btn-info">
                        <em class="fa fa-check"></em>
                        <strong>John Carter</strong>
                     </label>
                  </div>
                  <div class="btn-switch mb btn-switch-inverse">
                     <input type="checkbox" id="input-btn-switch-21" ng-model="areaSplineSeries[1]" class="ng-pristine ng-untouched ng-valid">
                     <label for="input-btn-switch-21" class="btn btn-oval btn-fw btn-inverse">
                        <em class="fa fa-check"></em>
                        <strong>Henry</strong>
                     </label>
                  </div>
                  <div class="btn-switch mb btn-switch-inverse">
                     <input type="checkbox" id="input-btn-switch-22" ng-model="areaSplineSeries[2]" class="ng-pristine ng-untouched ng-valid">
                     <label for="input-btn-switch-22" style="color: #003b6d" class="btn btn-oval btn-fw btn-inverse">
                        <em class="fa fa-check"></em>
                        <strong>Bruce</strong>
                     </label>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
   <!-- END row-->

   <!-- START row-->
   <div class="panel panel-default">
      <div class="panel-heading">
         <div class="panel-title">Live Users (Realtime)</div>
      </div>
      <div class="panel-body">
         <div class="row">
            <div class="col-md-12">
               <flot dataset="realTimeChartData" options="realTimeChartOpts" height="300" class="ng-isolate-scope"><div style="width: 100%; height: 300px; padding: 0px; position: relative;"><canvas class="flot-base" width="938" height="300" style="direction: ltr; position: absolute; left: 0px; top: 0px; width: 938px; height: 300px;"></canvas><div class="flot-text" style="position: absolute; top: 0px; left: 0px; bottom: 0px; right: 0px; font-size: smaller; color: rgb(84, 84, 84);"><div class="flot-y-axis flot-y1-axis yAxis y1Axis" style="position: absolute; top: 0px; left: 0px; bottom: 0px; right: 0px; display: block;"><div class="flot-tick-label tickLabel" style="position: absolute; top: 284px; left: 12px; text-align: right;">0</div><div class="flot-tick-label tickLabel" style="position: absolute; top: 229px; left: 6px; text-align: right;">25</div><div class="flot-tick-label tickLabel" style="position: absolute; top: 175px; left: 6px; text-align: right;">50</div><div class="flot-tick-label tickLabel" style="position: absolute; top: 120px; left: 6px; text-align: right;">75</div><div class="flot-tick-label tickLabel" style="position: absolute; top: 66px; left: 0px; text-align: right;">100</div><div class="flot-tick-label tickLabel" style="position: absolute; top: 11px; left: 0px; text-align: right;">125</div></div></div><canvas class="flot-overlay" width="938" height="300" style="direction: ltr; position: absolute; left: 0px; top: 0px; width: 938px; height: 300px;"></canvas></div></flot>
            </div>
         </div>
      </div>
   </div>
    </div>
</div>
