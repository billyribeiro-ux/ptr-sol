        <script type="text/javascript">
jQuery.logger = function( text ){   if( (window['console'] !== undefined) ){ console.log( text );}}
 function contactPost(event){
     var email=$("#email").val();
     if (email==null || email.length<3) {
         bootbox.alert("Please enter a valid email");
         return;
     }
     var msg=$("#msg").val();
     if (msg==null || msg.length<3) {
         bootbox.alert("Please enter a message");
         return;
     }
     
     var fname=$("#fname").val();
     if (fname==null || fname.length<3) {
         bootbox.alert("Please enter a valid name");
         return;
     }
     msg+="\n\nBrowser: "+window.navigator.userAgent;
     
     var data = {
         "msg": msg,
         "fname": fname,
         "email": email,
         "recaptcha": $("#g-recaptcha-response").val()
         
     };
     event.preventDefault();
         $.ajax({
          type: "POST",
          url: '/users/v1/p/contact',
          data: data,
          success: function(rdata){
              if (rdata){
                  bootbox.alert(rdata.msg,function(){
                     if (rdata.success) {
                         window.location.href="/";
                     } 
                  });
                  
              }
          },
          error: function(xhr){ bootbox.alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || "Contact service is unavailable. Please try again later."); }

         });
        }
        </script>
