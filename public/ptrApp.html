  <style>.g-recaptcha { display: none; }</style>
  <script>
    function ptrRecaptchaOnload() {
      function renderAll() {
        var els = document.querySelectorAll('.g-recaptcha:not([data-rc-done])');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          try {
            grecaptcha.render(el, {sitekey: window.PTR_CONFIG.recaptchaSiteKey});
            el.setAttribute('data-rc-done', '1');
            el.style.display = 'block';
          } catch (e) { /* A later view update may make the widget renderable. */ }
        }
      }
      renderAll();
      setInterval(renderAll, 800);
    }
    if (window.PTR_CONFIG.recaptchaSiteKey) {
      var ptrCaptchaScript = document.createElement('script');
      ptrCaptchaScript.src = 'https://www.google.com/recaptcha/api.js?render=explicit&onload=ptrRecaptchaOnload';
      ptrCaptchaScript.async = true; ptrCaptchaScript.defer = true;
      document.head.appendChild(ptrCaptchaScript);
    }
  </script>

    var sc_widget,
      sc_currVol = 100;
    var audioPlayer = null;
    function setBkgMusicVol(v) {
      console.log('sc vol: ' + v);
      //also do sound effects
      if (!audioPlayer) {
        audioPlayer = $('#audioPlayer');
      }
      audioPlayer.prop('volume', v / 100);
      if (sc_widget) {
        sc_widget.setVolume(v);
        sc_currVol = v;
        $('#scMusicVolumeVal').text(v);
      }
    }
    function wireUpSoundCloud(newSoundUrl) {
      lg('** wiring up soundcloud...url:' + newSoundUrl);
      try {
        if (!sc_widget) {
          var widgetIframe = document.getElementById('soundCloudIFrame');
          sc_widget = SC.Widget(widgetIframe);
        }
        sc_widget.bind(SC.Widget.Events.READY, function () {
          lg('** sc ready....');
          sc_widget.setVolume(sc_currVol);
          lg('** set sc vol to:' + sc_currVol);
          sc_widget.load(newSoundUrl, {
            auto_play: true,
            show_artwork: false,
          });
          sc_widget.bind(SC.Widget.Events.PLAY, function () {
            // get information about currently playing sound
            sc_widget.setVolume(sc_currVol);
            lg('** set sc vol from playing event to:' + sc_currVol);
          });
        });
      } catch (eee) {
        console.error(eee);
      }
    }
  </script>
