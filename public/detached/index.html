  <script>
  function openImageModal(url) {
    var imageName = url.substring(url.lastIndexOf('/') + 1)
    var content = document.createElement('div');
    var img = document.createElement('img');
    img.src = url;
    img.alt = imageName;
    content.appendChild(img);
    content.appendChild(document.createElement('hr'));
    var button = document.createElement('button');
    button.className = 'btn btn-primary btn-sm';
    button.textContent = 'Download Image';
    button.addEventListener('click', function () { downloadImage(url, imageName); });
    content.appendChild(button);
    return bootbox.dialog({ onEscape: true, message: content, closeButton: true,
      size: 'large', className: 'imgur-modal' });
  }
  function downloadImage(url, imageName) {
    var xhr = new XMLHttpRequest()
    xhr.open('GET', url, true)
    xhr.responseType = 'blob'
    xhr.onload = function() {
      var urlCreator = window.URL || window.webkitURL
      var imageUrl = urlCreator.createObjectURL(this.response)
      var tag = document.createElement('a')
      tag.href = imageUrl
      tag.download = imageName
      tag.style.display = 'none'
      document.body.appendChild(tag)
      tag.click()
      document.body.removeChild(tag)
    }
    xhr.send()
  }
  
  </script>
