<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; margin: 0; padding: 0; background: #f6f8fa; }
    .container { max-width: 980px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; box-shadow: 0 1px 0 rgba(27,31,36,.04); }
    .card-header { padding: 16px; border-bottom: 1px solid #d0d7de; font-weight: 600; }
    .card-body { padding: 24px; }
    .markdown-body { line-height: 1.6; color: #24292f; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
    .markdown-body code, .markdown-body pre { background-color: #f6f8fa; border-radius: 6px; }
    .markdown-body pre { padding: 16px; overflow: auto; }
    .markdown-body table { border-collapse: collapse; }
    .markdown-body table th, .markdown-body table td { border: 1px solid #d0d7de; padding: 6px 13px; }
    .topbar { background: #24292f; color: #fff; padding: 12px 16px; }
    .topbar a { color: #fff; text-decoration: none; opacity: .9; }
    .topbar a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/ptrApp#/page/welcome">← Back to PTR</a>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-header">API Documentation</div>
      <div id="content" class="card-body markdown-body">Loading...</div>
    </div>
  </div>

  <script src="/public/vendor/marked/15.0.12/marked.min.js"></script>
  <script src="/public/vendor/dompurify/purify.min.js"></script>
  <script>
    (function () {
      var mdPath = 'API_Documentation.md';
      // Allow override via ?src=... query
      try {
        var url = new URL(window.location.href);
        var src = url.searchParams.get('src');
        if (src === '/public/html/API_Documentation.md' || src === 'API_Documentation.md') { mdPath = src; }
      } catch (e) {}

      fetch(mdPath, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('Failed to load markdown'); return r.text(); })
        .then(function (text) {
          text = text.replace(/https:\/\/(?:ptrv3\.)?protradingroom\.com(?=\/(?:stats|users)\/v1)/g, window.location.origin);
          document.getElementById('content').innerHTML = DOMPurify.sanitize(marked.parse(text));
        })
        .catch(function (err) {
          document.getElementById('content').textContent = 'Error loading documentation: ' + err.message;
        });
    })();
  </script>
</body>
</html>
